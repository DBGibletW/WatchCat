name: WatchCat APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: Java 21 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: İkon Kütüphanesini Hazırla
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil

      - name: Android Klasörünü Oluştur, Logo ve Firebase Bağla
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp -r lib /tmp/lib.bak

          if [ -f "logo.png" ]; then
            cp logo.png /tmp/logo.png
          fi

          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          elif [ -f "google-services.json" ]; then
            cp google-services.json /tmp/google-services.json
          else
            echo "HATA: google-services.json bulunamadi! Lutfen deponun ana dizinine yukleyin."
            exit 1
          fi

          flutter create . --platforms=android --org com.dbgibletw --project-name watchcat

          cp /tmp/pubspec.yaml.bak pubspec.yaml
          rm -rf lib && cp -r /tmp/lib.bak lib
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json

          python3 - << 'EOF'
          from pathlib import Path
          import re
          from PIL import Image, ImageDraw

          plugin_id = "com.google.gms.google-services"

          # 1. settings.gradle(.kts) -> Google Services plugin ekle
          settings_kts = Path("android/settings.gradle.kts")
          settings_groovy = Path("android/settings.gradle")
          if settings_kts.exists():
              text = settings_kts.read_text()
              if plugin_id not in text:
                  text = re.sub(
                      r'(id\("dev\.flutter\.flutter-plugin-loader"[^\n]*)',
                      r'\1\n    id("com.google.gms.google-services") version "4.4.4" apply false',
                      text,
                      count=1,
                  )
                  settings_kts.write_text(text)
          elif settings_groovy.exists():
              text = settings_groovy.read_text()
              if plugin_id not in text:
                  text = re.sub(
                      r'(id\s+["\']dev\.flutter\.flutter-plugin-loader["\'][^\n]*)',
                      r'\1\n    id "com.google.gms.google-services" version "4.4.4" apply false',
                      text,
                      count=1,
                  )
                  settings_groovy.write_text(text)

          # 2. app/build.gradle(.kts) -> Google Services uygula + minSdk = 24 yap
          app_kts = Path("android/app/build.gradle.kts")
          app_groovy = Path("android/app/build.gradle")
          if app_kts.exists():
              text = app_kts.read_text()
              if plugin_id not in text:
                  text = re.sub(
                      r'(id\("dev\.flutter\.flutter-gradle-plugin"[^\n]*)',
                      r'\1\n    id("com.google.gms.google-services")',
                      text,
                      count=1,
                  )
              text = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24', text)
              app_kts.write_text(text)
          elif app_groovy.exists():
              text = app_groovy.read_text()
              if plugin_id not in text:
                  text = re.sub(
                      r'(id\s+["\']dev\.flutter\.flutter-gradle-plugin["\'][^\n]*)',
                      r'\1\n    id "com.google.gms.google-services"',
                      text,
                      count=1,
                  )
              text = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24', text)
              text = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 24', text)
              app_groovy.write_text(text)

          # 3. AndroidManifest.xml -> İzinler, Uygulama Adı ve FCM Bildirim İkonu
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              text = manifest.read_text()
              perms = []
              if "android.permission.INTERNET" not in text:
                  perms.append('    <uses-permission android:name="android.permission.INTERNET"/>')
              if "android.permission.POST_NOTIFICATIONS" not in text:
                  perms.append('    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>')
              if perms:
                  text = re.sub(
                      r'(<manifest[^>]*>)',
                      r'\1\n' + "\n".join(perms),
                      text,
                      count=1,
                  )
              text = re.sub(r'android:label="[^"]*"', 'android:label="WatchCat"', text, count=1)

              if "com.google.firebase.messaging.default_notification_icon" not in text:
                  meta_block = (
                      '        <meta-data\n'
                      '            android:name="com.google.firebase.messaging.default_notification_icon"\n'
                      '            android:resource="@drawable/ic_stat_watchcat" />\n'
                      '        <meta-data\n'
                      '            android:name="com.google.firebase.messaging.default_notification_color"\n'
                      '            android:resource="@color/watchcat_notification_color" />\n'
                  )
                  text = text.replace("</application>", meta_block + "    </application>")

              manifest.write_text(text)

          res_dir = Path("android/app/src/main/res")

          # 4. WatchCat Ana Uygulama İkonu
          custom_logo = Path("/tmp/logo.png")
          if custom_logo.exists():
              base_icon = Image.open(custom_logo).convert("RGBA")
          else:
              size = 512
              base_icon = Image.new("RGBA", (size, size), (20, 20, 28, 255))
              draw = ImageDraw.Draw(base_icon)
              coral = (255, 107, 74, 255)
              white = (255, 255, 255, 255)

              draw.polygon([(115, 225), (140, 88), (238, 175)], fill=coral)
              draw.polygon([(397, 225), (372, 88), (274, 175)], fill=coral)
              draw.ellipse((106, 145, 406, 425), fill=coral)
              draw.polygon([(220, 228), (220, 342), (322, 285)], fill=white)

          mipmap_sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, px in mipmap_sizes.items():
              out_dir = res_dir / folder
              out_dir.mkdir(parents=True, exist_ok=True)
              resized = base_icon.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(out_dir / "ic_launcher.png")

          # 5. WatchCat Bildirim İkonu
          notif_base = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          notif_draw = ImageDraw.Draw(notif_base)
          pure_white = (255, 255, 255, 255)
          transparent = (0, 0, 0, 0)

          notif_draw.polygon([(44, 232), (72, 20), (222, 138)], fill=pure_white)
          notif_draw.polygon([(468, 232), (440, 20), (290, 138)], fill=pure_white)
          notif_draw.ellipse((24, 108, 488, 492), fill=pure_white)
          notif_draw.polygon([(198, 214), (198, 386), (356, 300)], fill=transparent)

          notif_sizes = {
              "drawable-mdpi": 24,
              "drawable-hdpi": 36,
              "drawable-xhdpi": 48,
              "drawable-xxhdpi": 72,
              "drawable-xxxhdpi": 96,
          }
          for folder, px in notif_sizes.items():
              out_dir = res_dir / folder
              out_dir.mkdir(parents=True, exist_ok=True)
              resized = notif_base.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(out_dir / "ic_stat_watchcat.png")

          # 6. Bildirim Vurgu Rengi (#FF6B4A)
          values_dir = res_dir / "values"
          values_dir.mkdir(parents=True, exist_ok=True)
          colors_file = values_dir / "colors.xml"
          if colors_file.exists():
              ctext = colors_file.read_text()
              if "watchcat_notification_color" not in ctext:
                  ctext = ctext.replace(
                      "</resources>",
                      '    <color name="watchcat_notification_color">#FF6B4A</color>\n</resources>',
                  )
                  colors_file.write_text(ctext)
          else:
              colors_file.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  '    <color name="watchcat_notification_color">#FF6B4A</color>\n'
                  '</resources>\n'
              )
          EOF

      - name: Paketleri Yükle
        run: flutter pub get

      - name: APK Derle
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/WatchCat.apk

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: WatchCat-APK
          path: build/app/outputs/flutter-apk/WatchCat.apk
