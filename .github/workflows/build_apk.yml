name: WatchCat APK Derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: Java 21 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: İkon Kütüphanesini Hazırla
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil

      - name: Android Klasörünü Oluştur, Bildirim Kanalı, Logo ve Firebase Bağla
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp -r lib /tmp/lib.bak

          if [ -f "logo.png" ]; then
            cp logo.png /tmp/logo.png
          fi

          if [ -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json /tmp/google-services.json
          elif [ -f "google-services.json" ]; then
            cp google-services.json /tmp/google-services.json
          else
            echo "HATA: google-services.json bulunamadi! Lutfen deponun ana dizinine yukleyin."
            exit 1
          fi

          flutter create . --platforms=android --org com.dbgibletw --project-name watchcat

          cp /tmp/pubspec.yaml.bak pubspec.yaml
          rm -rf lib && cp -r /tmp/lib.bak lib
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json

          python3 - << 'EOF'
          from pathlib import Path
          import re
          import textwrap
          from PIL import Image, ImageDraw

          plugin_id = "com.google.gms.google-services"

          # 1. settings.gradle(.kts) -> Google Services plugin ekle
          settings_kts = Path("android/settings.gradle.kts")
          settings_groovy = Path("android/settings.gradle")
          if settings_kts.exists():
              text = settings_kts.read_text()
              if plugin_id not in text:
                  text = re.sub(
                      r'(id\("dev\.flutter\.flutter-plugin-loader"[^\n]*)',
                      r'\1\n    id("com.google.gms.google-services") version "4.4.4" apply false',
                      text,
                      count=1,
                  )
                  settings_kts.write_text(text)
          elif settings_groovy.exists():
              text = settings_groovy.read_text()
              if plugin_id not in text:
                  text = re.sub(
                      r'(id\s+["\']dev\.flutter\.flutter-plugin-loader["\'][^\n]*)',
                      r'\1\n    id "com.google.gms.google-services" version "4.4.4" apply false',
                      text,
                      count=1,
                  )
                  settings_groovy.write_text(text)

          # 2. app/build.gradle(.kts) -> Google Services + minSdk 24 (Android 7.0+) + compileSdk/targetSdk >= 35
          app_kts = Path("android/app/build.gradle.kts")
          app_groovy = Path("android/app/build.gradle")
          if app_kts.exists():
              text = app_kts.read_text()
              if plugin_id not in text:
                  text = re.sub(
                      r'(id\("dev\.flutter\.flutter-gradle-plugin"[^\n]*)',
                      r'\1\n    id("com.google.gms.google-services")',
                      text,
                      count=1,
                  )
              text = re.sub(
                  r'compileSdk\s*=\s*flutter\.compileSdkVersion',
                  'compileSdk = Math.max(flutter.compileSdkVersion, 35)',
                  text,
              )
              text = re.sub(
                  r'targetSdk\s*=\s*flutter\.targetSdkVersion',
                  'targetSdk = Math.max(flutter.targetSdkVersion, 35)',
                  text,
              )
              text = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24', text)
              app_kts.write_text(text)
          elif app_groovy.exists():
              text = app_groovy.read_text()
              if plugin_id not in text:
                  text = re.sub(
                      r'(id\s+["\']dev\.flutter\.flutter-gradle-plugin["\'][^\n]*)',
                      r'\1\n    id "com.google.gms.google-services"',
                      text,
                      count=1,
                  )
              text = re.sub(
                  r'compileSdk\s*=\s*flutter\.compileSdkVersion',
                  'compileSdk = Math.max(flutter.compileSdkVersion, 35)',
                  text,
              )
              text = re.sub(
                  r'compileSdkVersion\s+flutter\.compileSdkVersion',
                  'compileSdkVersion Math.max(flutter.compileSdkVersion, 35)',
                  text,
              )
              text = re.sub(
                  r'targetSdk\s*=\s*flutter\.targetSdkVersion',
                  'targetSdk = Math.max(flutter.targetSdkVersion, 35)',
                  text,
              )
              text = re.sub(
                  r'targetSdkVersion\s+flutter\.targetSdkVersion',
                  'targetSdkVersion Math.max(flutter.targetSdkVersion, 35)',
                  text,
              )
              text = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24', text)
              text = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 24', text)
              app_groovy.write_text(text)

          # 3. MainActivity.kt -> Android 7.1.2 / 11-12 / 13+ Kanal, İzin ve Ön Plan Bildirim Yönetimi
          main_activity = Path("android/app/src/main/kotlin/com/dbgibletw/watchcat/MainActivity.kt")
          main_activity.parent.mkdir(parents=True, exist_ok=True)
          main_activity.write_text(textwrap.dedent('''\
          package com.dbgibletw.watchcat

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.ActivityNotFoundException
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.media.AudioAttributes
          import android.media.RingtoneManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.util.Log
          import com.google.android.gms.common.ConnectionResult
          import com.google.android.gms.common.GoogleApiAvailability
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              companion object {
                  private const val TAG = "WatchCatFCM"
                  private const val CHANNEL = "com.dbgibletw.watchcat/notifications"
                  private const val DEFAULT_CHANNEL_ID = "watchcat_default_channel"
                  private const val DEFAULT_CHANNEL_NAME = "WatchCat Bildirimleri"
                  private const val REQUEST_CODE_POST_NOTIFICATIONS = 1001
                  private const val PREFS_NAME = "watchcat_notification_prefs"
                  private const val KEY_ASKED_BEFORE = "asked_post_notifications"
                  private const val KEY_SUBSCRIBED_ALL_USERS = "subscribed_all_users"
              }

              private var pendingPermissionResult: MethodChannel.Result? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  // Android 8+ (Android 12 dahil) ilk kanalı uygulama ön plandayken oluştur
                  ensureNotificationChannel()
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "getNotificationState" -> {
                                  result.success(buildNotificationState())
                              }
                              "requestNotificationPermission" -> {
                                  handleRequestPermission(result)
                              }
                              "markAllUsersSubscribed" -> {
                                  getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                                      .edit()
                                      .putBoolean(KEY_SUBSCRIBED_ALL_USERS, true)
                                      .apply()
                                  result.success(true)
                              }
                              "openNotificationSettings" -> {
                                  openAppNotificationSettings()
                                  result.success(true)
                              }
                              "showLocalNotification" -> {
                                  val title = call.argument<String>("title") ?: "WatchCat"
                                  val body = call.argument<String>("body") ?: ""
                                  result.success(showLocalNotification(title, body))
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              private fun ensureNotificationChannel(): String {
                  // Android 7.1.2 (API 25) ve altı NotificationChannel gerektirmez
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) {
                      Log.d(TAG, "SDK ${Build.VERSION.SDK_INT} (< 26): NotificationChannel atlandi.")
                      return "skipped_pre_oreo"
                  }

                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
                      ?: return "error_no_notification_manager"

                  val existing = manager.getNotificationChannel(DEFAULT_CHANNEL_ID)
                  if (existing != null) {
                      return "already_exists_importance_${existing.importance}"
                  }

                  val soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                  val audioAttributes = AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                      .build()

                  val channel = NotificationChannel(
                      DEFAULT_CHANNEL_ID,
                      DEFAULT_CHANNEL_NAME,
                      NotificationManager.IMPORTANCE_HIGH,
                  ).apply {
                      description = "WatchCat yeni kedi videolari ve duyuru bildirimleri"
                      enableLights(true)
                      lightColor = Color.parseColor("#FF6B4A")
                      enableVibration(true)
                      setSound(soundUri, audioAttributes)
                      lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                  }

                  manager.createNotificationChannel(channel)
                  Log.d(TAG, "Bildirim kanali olusturuldu: $DEFAULT_CHANNEL_ID")
                  return "created_$DEFAULT_CHANNEL_ID"
              }

              private fun checkGooglePlayServices(): Pair<Boolean, String> {
                  return try {
                      val availability = GoogleApiAvailability.getInstance()
                      val code = availability.isGooglePlayServicesAvailable(this)
                      val ok = code == ConnectionResult.SUCCESS
                      val status = availability.getErrorString(code)
                      Log.d(TAG, "Google Play Services: ok=$ok, status=$status (code=$code)")
                      Pair(ok, status)
                  } catch (e: Throwable) {
                      Log.e(TAG, "Google Play Services kontrol hatasi", e)
                      Pair(false, e.message ?: "check_failed")
                  }
              }

              private fun areNotificationsEnabled(): Boolean {
                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
                  return manager?.areNotificationsEnabled() ?: true
              }

              private fun buildNotificationState(): Map<String, Any> {
                  val channelStatus = ensureNotificationChannel()
                  val (playServicesAvailable, playServicesStatus) = checkGooglePlayServices()

                  val sdkInt = Build.VERSION.SDK_INT
                  val isAndroid13OrAbove = sdkInt >= Build.VERSION_CODES.TIRAMISU
                  val prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val askedBefore = prefs.getBoolean(KEY_ASKED_BEFORE, false)
                  val allUsersSubscribed = prefs.getBoolean(KEY_SUBSCRIBED_ALL_USERS, false)

                  val granted = if (isAndroid13OrAbove) {
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) ==
                          PackageManager.PERMISSION_GRANTED && areNotificationsEnabled()
                  } else {
                      areNotificationsEnabled()
                  }

                  val shouldRequestRuntime = isAndroid13OrAbove &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) !=
                      PackageManager.PERMISSION_GRANTED &&
                      !askedBefore

                  return mapOf(
                      "sdkInt" to sdkInt,
                      "androidRelease" to (Build.VERSION.RELEASE ?: ""),
                      "isAndroid13OrAbove" to isAndroid13OrAbove,
                      "granted" to granted,
                      "askedBefore" to askedBefore,
                      "shouldRequestRuntime" to shouldRequestRuntime,
                      "allUsersSubscribed" to allUsersSubscribed,
                      "playServicesAvailable" to playServicesAvailable,
                      "playServicesStatus" to playServicesStatus,
                      "channelStatus" to channelStatus,
                  )
              }

              private fun handleRequestPermission(result: MethodChannel.Result) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU) {
                      result.success(areNotificationsEnabled())
                      return
                  }

                  if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) ==
                      PackageManager.PERMISSION_GRANTED
                  ) {
                      result.success(areNotificationsEnabled())
                      return
                  }

                  val prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  prefs.edit().putBoolean(KEY_ASKED_BEFORE, true).apply()

                  pendingPermissionResult?.success(false)
                  pendingPermissionResult = result

                  requestPermissions(
                      arrayOf(Manifest.permission.POST_NOTIFICATIONS),
                      REQUEST_CODE_POST_NOTIFICATIONS,
                  )
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray,
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)

                  if (requestCode == REQUEST_CODE_POST_NOTIFICATIONS) {
                      val granted = grantResults.isNotEmpty() &&
                          grantResults[0] == PackageManager.PERMISSION_GRANTED &&
                          areNotificationsEnabled()
                      pendingPermissionResult?.success(granted)
                      pendingPermissionResult = null
                  }
              }

              private fun showLocalNotification(title: String, body: String): Map<String, Any> {
                  val manager = getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
                      ?: return mapOf("shown" to false, "error" to "NotificationManager bulunamadi")

                  if (!manager.areNotificationsEnabled()) {
                      return mapOf("shown" to false, "error" to "Sistem ayarlarindan bildirimler kapali")
                  }

                  return try {
                      val launchIntent = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP
                      }
                      val pendingFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      } else {
                          PendingIntent.FLAG_UPDATE_CURRENT
                      }
                      val pendingIntent = PendingIntent.getActivity(this, 0, launchIntent, pendingFlags)

                      val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          ensureNotificationChannel()
                          Notification.Builder(this, DEFAULT_CHANNEL_ID)
                      } else {
                          // Android 7.1.2 (API 25): channelId kullanma, varsayılan ses ve yüksek öncelik ver
                          @Suppress("DEPRECATION")
                          Notification.Builder(this)
                              .setPriority(Notification.PRIORITY_HIGH)
                              .setDefaults(Notification.DEFAULT_ALL)
                      }

                      val notification = builder
                          .setSmallIcon(R.drawable.ic_stat_watchcat)
                          .setColor(Color.parseColor("#FF6B4A"))
                          .setContentTitle(title.ifBlank { "WatchCat" })
                          .setContentText(body)
                          .setStyle(Notification.BigTextStyle().bigText(body))
                          .setAutoCancel(true)
                          .setContentIntent(pendingIntent)
                          .build()

                      val notifId = (System.currentTimeMillis() and 0x7FFFFFFF).toInt()
                      manager.notify(notifId, notification)
                      Log.d(TAG, "Bildirim ekranda gosterildi: id=$notifId")
                      mapOf("shown" to true, "notificationId" to notifId)
                  } catch (e: Exception) {
                      Log.e(TAG, "Bildirim gosterilemedi", e)
                      mapOf("shown" to false, "error" to (e.message ?: e.toString()))
                  }
              }

              private fun openAppNotificationSettings() {
                  val intent = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS).apply {
                          putExtra(Settings.EXTRA_APP_PACKAGE, packageName)
                      }
                  } else {
                      Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                          data = Uri.fromParts("package", packageName, null)
                      }
                  }
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)

                  try {
                      startActivity(intent)
                  } catch (_: ActivityNotFoundException) {
                      val fallback = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                          data = Uri.fromParts("package", packageName, null)
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      startActivity(fallback)
                  }
              }
          }
          '''))

          # 4. AndroidManifest.xml -> İzinler, Uygulama Adı, FCM Varsayılan Kanalı, İkon ve Renk
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              text = manifest.read_text()
              required_perms = [
                  "android.permission.INTERNET",
                  "android.permission.ACCESS_NETWORK_STATE",
                  "android.permission.WAKE_LOCK",
                  "android.permission.VIBRATE",
                  "android.permission.POST_NOTIFICATIONS",
              ]
              perms_to_add = [
                  f'    <uses-permission android:name="{perm}"/>'
                  for perm in required_perms
                  if perm not in text
              ]
              if perms_to_add:
                  text = re.sub(
                      r'(<manifest[^>]*>)',
                      r'\1\n' + "\n".join(perms_to_add),
                      text,
                      count=1,
                  )
              text = re.sub(r'android:label="[^"]*"', 'android:label="WatchCat"', text, count=1)

              meta_lines = []
              if "com.google.firebase.messaging.default_notification_channel_id" not in text:
                  meta_lines.append(
                      '        <meta-data\n'
                      '            android:name="com.google.firebase.messaging.default_notification_channel_id"\n'
                      '            android:value="watchcat_default_channel" />'
                  )
              if "com.google.firebase.messaging.default_notification_icon" not in text:
                  meta_lines.append(
                      '        <meta-data\n'
                      '            android:name="com.google.firebase.messaging.default_notification_icon"\n'
                      '            android:resource="@drawable/ic_stat_watchcat" />'
                  )
              if "com.google.firebase.messaging.default_notification_color" not in text:
                  meta_lines.append(
                      '        <meta-data\n'
                      '            android:name="com.google.firebase.messaging.default_notification_color"\n'
                      '            android:resource="@color/watchcat_notification_color" />'
                  )
              if meta_lines:
                  text = text.replace("</application>", "\n".join(meta_lines) + "\n    </application>")

              manifest.write_text(text)

          res_dir = Path("android/app/src/main/res")

          # 5. WatchCat Ana Uygulama İkonu
          custom_logo = Path("/tmp/logo.png")
          if custom_logo.exists():
              base_icon = Image.open(custom_logo).convert("RGBA")
          else:
              size = 512
              base_icon = Image.new("RGBA", (size, size), (20, 20, 28, 255))
              draw = ImageDraw.Draw(base_icon)
              coral = (255, 107, 74, 255)
              white = (255, 255, 255, 255)

              draw.polygon([(115, 225), (140, 88), (238, 175)], fill=coral)
              draw.polygon([(397, 225), (372, 88), (274, 175)], fill=coral)
              draw.ellipse((106, 145, 406, 425), fill=coral)
              draw.polygon([(220, 228), (220, 342), (322, 285)], fill=white)

          mipmap_sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, px in mipmap_sizes.items():
              out_dir = res_dir / folder
              out_dir.mkdir(parents=True, exist_ok=True)
              resized = base_icon.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(out_dir / "ic_launcher.png")

          # 6. WatchCat Bildirim İkonu
          notif_base = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          notif_draw = ImageDraw.Draw(notif_base)
          pure_white = (255, 255, 255, 255)
          transparent = (0, 0, 0, 0)

          notif_draw.polygon([(44, 232), (72, 20), (222, 138)], fill=pure_white)
          notif_draw.polygon([(468, 232), (440, 20), (290, 138)], fill=pure_white)
          notif_draw.ellipse((24, 108, 488, 492), fill=pure_white)
          notif_draw.polygon([(198, 214), (198, 386), (356, 300)], fill=transparent)

          notif_sizes = {
              "drawable-mdpi": 24,
              "drawable-hdpi": 36,
              "drawable-xhdpi": 48,
              "drawable-xxhdpi": 72,
              "drawable-xxxhdpi": 96,
          }
          for folder, px in notif_sizes.items():
              out_dir = res_dir / folder
              out_dir.mkdir(parents=True, exist_ok=True)
              resized = notif_base.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(out_dir / "ic_stat_watchcat.png")

          # 7. Bildirim Vurgu Rengi (#FF6B4A)
          values_dir = res_dir / "values"
          values_dir.mkdir(parents=True, exist_ok=True)
          colors_file = values_dir / "colors.xml"
          if colors_file.exists():
              ctext = colors_file.read_text()
              if "watchcat_notification_color" not in ctext:
                  ctext = ctext.replace(
                      "</resources>",
                      '    <color name="watchcat_notification_color">#FF6B4A</color>\n</resources>',
                  )
                  colors_file.write_text(ctext)
          else:
              colors_file.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  '    <color name="watchcat_notification_color">#FF6B4A</color>\n'
                  '</resources>\n'
              )
          EOF

      - name: Paketleri Yükle
        run: flutter pub get

      - name: APK Derle
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/WatchCat.apk

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: WatchCat-APK
          path: build/app/outputs/flutter-apk/WatchCat.apk
